# Builds and tests IndependentKnob on every push and pull request to main, in Debug and Release.
# The Release run also publishes the app as one self-contained IndependentKnob.exe (runs without
# installing .NET) and uploads it as a build artifact, downloadable from the workflow run's page.
#
# To publish a GitHub release with the exe attached, push a version tag:
#   git tag v1.0.0
#   git push origin v1.0.0

name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    # The app uses Windows-only APIs (keyboard hook, Core Audio), so it is built and tested on Windows.
    runs-on: windows-latest

    env:
      Solution_Name: IndependentKnob.slnx
      App_Project_Path: IndependentKnob.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build $env:Solution_Name --configuration ${{ matrix.configuration }}

    - name: Run unit tests
      run: dotnet test $env:Solution_Name --configuration ${{ matrix.configuration }} --no-build

    # Single file with the .NET runtime included and compressed (~48 MB instead of ~100 MB).
    - name: Publish the app
      if: matrix.configuration == 'Release'
      run: >-
        dotnet publish $env:App_Project_Path --configuration Release --runtime win-x64 --self-contained
        -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
        --output publish

    - name: Upload the app
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: IndependentKnob-win-x64
        path: publish/IndependentKnob.exe
        if-no-files-found: error

  # Only for version tags, and only after both builds and their tests passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the exe

    steps:
    - name: Download the app
      uses: actions/download-artifact@v4
      with:
        name: IndependentKnob-win-x64

    - name: Create the release
      run: >-
        gh release create "$GITHUB_REF_NAME" IndependentKnob.exe
        --repo "$GITHUB_REPOSITORY" --title "IndependentKnob $GITHUB_REF_NAME" --generate-notes
      env:
        GH_TOKEN: ${{ github.token }}
